services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"
    restart: unless-stopped

  frontend-dev:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./ev-app/frontend:/app
      - frontend_modules:/app/node_modules
    ports:
      - "5173:5173"
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      API_PROXY_TARGET: http://api:8000
    depends_on:
      - api
    profiles:
      - dev

volumes:
  frontend_modules:
